[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evolutions-demo"
version = "0.2.0"
description = "Local apple chat and evaluation of original responses in Microsoft Foundry"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "azure-ai-projects==2.7.0",
  "azure-identity>=1.25,<2",
  "azure-monitor-opentelemetry==1.8.10",
  "azure-monitor-query>=2,<3",
  "fastapi>=0.115,<1",
  "openai>=3,<4",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1", "mypy>=1.15,<2"]

[tool.setuptools.packages.find]
include = ["demo", "demo.*"]
namespaces = false

[tool.setuptools.package-data]
demo = ["prompts/*.txt", "chat/static/*.html", "chat/static/*.js", "chat/static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
